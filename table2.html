<!DOCTYPE html>
<html>
<head>
    <title>Table Structure</title>
</head>

<body>

<center>

<table border="4" cellpadding="30" cellspacing="5" width="95%">

    <!-- Row 1 -->
    <tr>
        <td colspan="3">1</td>

        <td rowspan="3">2</td>

        <td colspan="2">3</td>

        <td rowspan="2">N</td>
    </tr>

    <!-- Row 2 -->
    <tr>
        <td>4</td>
        <td>5</td>
        <td>6</td>

        <td>7</td>
        <td>8</td>
    </tr>

    <!-- Row 3 -->
    <tr>
        <td colspan="3">9</td>

        <td colspan="2">10</td>

        <td>N</td>
    </tr>

    <!-- Row 4 -->
    <tr>
        <td colspan="7">N</td>
    </tr>

    <!-- Row 5 -->
    <tr>
        <td>N</td>
        <td>N</td>
        <td>N</td>
        <td>N</td>
        <td>N</td>
        <td>N</td>
        <td>N</td>
    </tr>

</table>

</center>

</body>
</html>
